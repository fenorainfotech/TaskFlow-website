<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f3d24" flood-opacity="0.14"/>
    </filter>
    <filter id="innerShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="5" stdDeviation="4" flood-color="#064e3b" flood-opacity="0.22"/>
    </filter>
    <linearGradient id="taskflowGrad" x1="80" y1="80" x2="430" y2="430" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="30%" stop-color="#16a34a"/>
      <stop offset="70%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
  </defs>

  <!-- Background White Squircle Card -->
  <rect x="28" y="28" width="456" height="456" rx="98" fill="#ffffff" filter="url(#shadow)"/>
  <rect x="29" y="29" width="454" height="454" rx="97" fill="none" stroke="#f1f5f2" stroke-width="2"/>

  <!-- Icon Elements with Depth Shadow -->
  <g filter="url(#innerShadow)">
    <!-- Main Outer Document Body -->
    <path d="
      M 345 220 
      V 165 
      C 345 120, 315 90, 270 90 
      H 180 
      C 135 90, 105 120, 105 165 
      V 320 
      C 105 365, 135 395, 180 395 
      H 245 
      V 325 
      C 245 305, 255 295, 255 295
    " stroke="url(#taskflowGrad)" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Bottom Leaf Corner Solid Shape -->
    <path d="M 200 320 C 245 320 250 300 250 295 V 395 H 200 Z" fill="url(#taskflowGrad)"/>

    <!-- 3 Checkmark List Items -->
    <path d="M 154 146 L 176 168 L 206 138" stroke="url(#taskflowGrad)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 154 214 L 176 236 L 206 206" stroke="url(#taskflowGrad)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 154 282 L 176 304 L 206 274" stroke="url(#taskflowGrad)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- 3 Horizontal Bar Lines -->
    <line x1="230" y1="152" x2="298" y2="152" stroke="url(#taskflowGrad)" stroke-width="22" stroke-linecap="round"/>
    <line x1="230" y1="220" x2="298" y2="220" stroke="url(#taskflowGrad)" stroke-width="22" stroke-linecap="round"/>
    <line x1="230" y1="288" x2="272" y2="288" stroke="url(#taskflowGrad)" stroke-width="22" stroke-linecap="round"/>

    <!-- Activity / Pulse Heartbeat Line -->
    <path d="
      M 268 318 
      H 318 
      L 345 248 
      L 378 382 
      L 408 308 
      H 432
    " stroke="url(#taskflowGrad)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
